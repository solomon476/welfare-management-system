<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23007a3d'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Solian Wolves — Welfare Management System (WMS)</title>
    <meta name="theme-color" content="#007a3d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Automatic recovery if stale chunks or cached HTML is encountered
      window.addEventListener('error', function(e) {
        if (e && e.message && (e.message.indexOf('Loading chunk') !== -1 || e.message.indexOf('Unexpected token') !== -1)) {
          if (!sessionStorage.getItem('sw_reload_attempted')) {
            sessionStorage.setItem('sw_reload_attempted', '1');
            window.location.reload(true);
          }
        }
      });
      // Clear legacy service workers
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var r of regs) r.unregister();
        });
        if ('caches' in window) {
          caches.keys().then(function(names) {
            for (var n of names) caches.delete(n);
          });
        }
      }
    </script>
    <style>
      @keyframes swSpin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at 50% 25%, rgba(0, 122, 61, 0.2) 0%, rgba(9, 13, 22, 0.98) 75%); color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <div style="text-align: center; padding: 20px;">
          <div style="width: 44px; height: 44px; border: 3px solid rgba(0, 122, 61, 0.3); border-top-color: #007a3d; border-radius: 50%; animation: swSpin 0.75s linear infinite; margin: 0 auto 16px;"></div>
          <h3 style="font-size: 1.1rem; font-weight: 700; margin: 0 0 6px 0; color: #ffffff;">Solian Wolves</h3>
          <p style="font-size: 0.8rem; color: #94a3b8; margin: 0;">Loading Welfare System...</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
